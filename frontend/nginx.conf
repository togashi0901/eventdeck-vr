server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ビルド済みアセットは長期キャッシュ (ファイル名にハッシュ入り)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
