# 本番/デモ用 (Oracle Cloud Always Free ARM VM 等の1台VM前提)
# 使い方: docker compose -f docker-compose.prod.yml up -d --build
# dev との違い:
#  - api はイメージ内のコードで起動 (--reload なし)。起動時に alembic upgrade head を実行
#  - front は Vite ビルド済みの静的配信 (nginx)
#  - メールUIは MailHog → Mailpit (ARM対応・後継)。SMTP互換なのでコード変更なし
#  - db / redis はホストへポートを公開しない
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - front
    restart: unless-stopped

  api:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: python -m worker.main
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: ./frontend
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventdeck
      POSTGRES_PASSWORD: eventdeck
      POSTGRES_DB: eventdeck
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventdeck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # メール確認UI (デモで参照)
    restart: unless-stopped

volumes:
  db_data:
